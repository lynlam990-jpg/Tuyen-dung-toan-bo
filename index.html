    '<div class="fld"><label for="cf-pic">PIC</label><select id="cf-pic" class="sel" data-chg="cf" data-k="pic">' + opt('pic', sortVi(uniq(C.map(function (c) { return c.pic; })))) + '</select></div>' +
    '<div class="fld"><label for="cf-major">Major</label><select id="cf-major" class="sel" data-chg="cf" data-k="major">' + opt('major', sortVi(uniq(C.map(function (c) { return c.major; })))) + '</select></div>' +
    '<div class="fld"><label for="cf-src">Nguồn</label><select id="cf-src" class="sel" data-chg="cf" data-k="src">' + opt('src', sortVi(uniq(C.map(function (c) { return c.source || 'Chưa ghi nguồn'; })))) + '</select></div>' +
    '<div class="fld"><label for="cf-round">Vòng hiện tại</label><select id="cf-round" class="sel" data-chg="cf" data-k="round">' + opt('round', STAGES) + '</select></div>' +
    '<div class="fld"><label for="cf-res">Kết quả tại vòng</label><select id="cf-res" class="sel" data-chg="cf" data-k="res">' + opt('res', uniq(CF_RES.concat(C.map(function (c) { return c.res; })))) + '</select></div>' +
    '<div class="fld" style="flex:1;min-width:240px"><label for="cf-q">Tìm kiếm</label><input id="cf-q" class="sel" style="max-width:none;width:100%" type="search" placeholder="Tên ứng viên" value="' + esc(f.q) + '" data-inp="cfq"></div>';
  var tags = [];
  if (f.from || f.to) tags.push(['date', 'Nhận CV ' + (f.from ? dm(f.from) : '…') + ' – ' + (f.to ? dm(f.to) : '…')]);
  [['job', 'Mã RQ'], ['reach', 'Đã qua vòng'], ['pic', 'PIC'], ['major', 'Major'], ['src', 'Nguồn'], ['round', 'Vòng'], ['res', 'Kết quả'], ['q', 'Tìm']].forEach(function (x) { if (f[x[0]]) tags.push([x[0], x[1] + ': ' + (x[0] === 'pic' ? picName(f[x[0]]) : x[0] === 'reach' ? STAGES[stageIdx(f[x[0]])] : f[x[0]])]); });
  h += '<div style="flex-basis:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div class="chips">' +
    tags.map(function (t) { return '<span class="ftag">' + esc(t[1]) + '<button aria-label="Bỏ điều kiện ' + esc(t[1]) + '" data-act="cfDel" data-k="' + t[0] + '">×</button></span>'; }).join('') +
    '</div><button class="lnk" data-act="cfClear">Xóa tất cả bộ lọc</button></div></section>';
  var sel = S.sel ? list.filter(function (c) { return c.row === S.sel; })[0] : null;
  h += '<div class="cand-layout"><section class="blk">' + candTable(list, S.cpage || 1, 'cPage', true) +
    '</section>' +
    (sel ? '<aside class="blk side">' + timeline(sel) + '</aside>' : '<aside class="blk side" style="color:var(--ink2);font-size:13px">Bấm tên một ứng viên để xem lịch sử từng vòng.</aside>') + '</div>';
  return h;
}
function timeline(c) {
  var steps = [
    { n: 'Nhận CV', ok: true, txt: (c.recv ? dmy(c.recv) : '') + ', nguồn ' + (c.source || 'chưa ghi') },
    { n: 'Sàng lọc', r: c.scrRes, d: c.scrDate, i: 0 },
    { n: 'PV1', r: c.r1, d: c.d1, by: c.p1, i: 1, why: c.f1 || c.noShow },
    { n: 'PV2', r: c.r2, d: c.d2, by: c.p2, i: 2, why: c.f2 },
    { n: 'PV3', r: c.r3, d: c.d3, by: c.p3, i: 3, why: c.f3 },
    { n: 'Offer', r: c.offerDate ? 'Đã gửi offer' : '', d: c.offerDate, i: 4, why: c.refuse },
    { n: 'Nhận việc', r: c.obRes, d: c.obDate, i: 5 }
  ];
  var stopped = c.res === 'Loại' || c.res === 'UV từ chối';
  var h = '<div style="display:flex;justify-content:space-between;gap:8px"><div><div style="font-size:18px;font-weight:800">' + esc(c.name) + '</div><div style="font-size:12px;color:var(--ink2)">' + esc((c.title || c.major || '') + ', ' + (c.branch || '')) + '</div>' +
    '<div style="font-size:12px;color:var(--ink2);margin-top:4px">' + esc((c.job ? 'Mã RQ ' + c.job : 'Không có mã RQ') + ' · PIC ' + (picName(c.pic) || '—') + ' · Nguồn ' + (c.source || 'chưa ghi')) + '</div></div>' +
    '<button class="icon-btn" aria-label="Đóng" data-act="selCand" data-v="">×</button></div><ol class="tl">';
  steps.forEach(function (s) {
    if (s.i === 3 && !c.r3 && !c.d3) return;
    var cls = '';
    if (s.ok) cls = 'ok';
    else if (s.i < c.idx) cls = 'ok';
    else if (s.i === c.idx) cls = stopped ? 'stop' : (c.idx === 5 ? 'ok' : 'cur');
    var detail = [];
    if (s.r) detail.push(s.i === 5 ? s.r : (s.i === 4 ? s.r : normRes(s.r)));
    if (s.d) detail.push(dmy(s.d));
    if (s.by) detail.push('PV: ' + s.by);
    if (s.why) detail.push('Lý do: ' + s.why);
    h += '<li><span class="d ' + cls + '"></span><b>' + s.n + '</b><span>' + esc(s.txt || detail.join(' · ') || (s.i > c.idx ? 'Chưa tới' : '—')) + '</span></li>';
  });
  var url = sheetLink(D.candsGid, c.row);
  return h + '</ol><a href="' + esc(url) + '" target="_blank" rel="noopener" style="font-size:13px;font-weight:700">Mở dòng gốc trong file dữ liệu ứng viên</a>';
}

/* =====================================================================
 * XUẤT EXCEL
 * ===================================================================== */
function exportExcel() {
  if (!D) return;
  var p = curP(), a = asOf(p), sheets = [];
  var meta = [['Người xuất', D.exporter || '(không xác định)'], ['Thời điểm xuất', new Date().toLocaleString('vi-VN')], ['Kỳ', p.title], ['Bộ lọc', JSON.stringify(S.f)]];
  var jobRows = function (list) {
    return [['Mã RQ', 'Vị trí', 'Major', 'Bộ phận', 'Tỉnh', 'Chi nhánh', 'PIC', 'Loại', 'Ngày YC', 'Deadline', 'OB date', 'Trễ (ngày)', 'Trạng thái', 'Status gốc', 'Note']].concat(
      decorateJobs(list, a).map(function (r) { var j = r.j; return [j.code, j.title, j.major, j.deptD, j.province, j.branch, j.pic, j.type, dmy(j.req), dmy(j.dl), dmy(j.ob), r.lateD == null ? '' : r.lateD, r.stLabel, j.status, j.note || '']; }));
  };
  var candRows = function (list) {
    return [['Họ tên', 'Vị trí', 'Major', 'Bộ phận', 'Chi nhánh', 'PIC', 'Nguồn', 'Nhóm nguồn', 'Nhận CV', 'Vòng hiện tại', 'Kết quả', 'Lý do loại', 'Mã RQ']].concat(
      list.map(function (c) { return [c.name, c.title, c.major, c.deptD, c.branch, c.pic, c.source, c.grp, dmy(c.recv), c.round, c.res, c.reasonTxt, c.job]; }));
  };
  if (S.screen === 'cands') sheets.push(['Ung vien', candRows(candFiltered())]);
  else if (S.tab === 'detail' && S.detail) {
    if (S.detail.kind === 'cand') { var si = stageIdx(S.detail.stage || 'all'); sheets.push(['Ung vien', candRows(cohort(p).filter(function (c) { return c.lvl >= si; }))]); }
    else sheets.push(['Job ' + S.detail.status, jobRows(detailJobList(S.detail, p).filter(function (j) { return !S.detail.pic || j.pic === S.detail.pic; }))]);
  } else if (S.tab === 'pic') {
    sheets.push(['The PIC', [['PIC', 'Phụ trách', 'Đã tuyển', 'Trong hạn', 'Trễ', 'Chờ NV', 'Tỷ lệ đáp ứng', 'Mới trong kỳ', 'CV', 'Nhận việc']].concat(
      picStats(p).map(function (r) { return [r.pic, r.total, r.done, r.ontime, r.late, r.waiting, Math.round(r.rate * 100) + '%', r.nw, r.cv, r.ob]; }))]);
    sheets.push(['Ung vien', candRows(FC())]);
  } else if (S.tab === 'source') {
    sheets.push(['CV trong ky', candRows(cohort(p))]);
  } else {
    sheets.push(['Job dang mo', jobRows(jobsBy('open', p))]);
    sheets.push(['RQ moi', jobRows(jobsBy('new', p))]);
    sheets.push(['Da tuyen', jobRows(jobsBy('done', p))]);
    sheets.push(['CV trong ky', candRows(cohort(p))]);
  }
  sheets.push(['Thong tin', meta]);
  var fname = 'Dashboard_TD_' + p.short.replace(/[^\w–-]/g, '') + '_' + D.today + '.xlsx';
  if (window.XLSX) {
    var wb = XLSX.utils.book_new();
    sheets.forEach(function (s) { XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s[1]), s[0].slice(0, 31)); });
    XLSX.writeFile(wb, fname);
  } else {
    var csv = sheets[0][1].map(function (r) { return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
    var aEl = document.createElement('a'); aEl.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); aEl.download = fname.replace('.xlsx', '.csv'); aEl.click();
  }
  toast('Đã xuất file Excel');
}

/* =====================================================================
 * SỰ KIỆN
 * ===================================================================== */
function setState(fn) { fn(); render(); }
function openDetail(o) { S.detail = Object.assign({ kind: 'job', status: 'open', pic: '', dept: '', prov: '', sort: '', dir: 'desc', page: 1 }, o); S.tab = 'detail'; window.scrollTo(0, 0); }

document.addEventListener('click', function (e) {
  if (UI.pop && !e.target.closest('.ms')) { UI.pop = null; UI.popQ = ''; render(); }
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  var act = el.getAttribute('data-act'), v = el.getAttribute('data-v'), k = el.getAttribute('data-k');
  switch (act) {
    case 'reload': UI.setup = false; load(true); break;
    case 'togglePass': {
      // Hiện / ẩn mật khẩu tại chỗ, không vẽ lại form để giữ nguyên chữ đã gõ
      UI.showPass = !UI.showPass;
      var pw = document.getElementById('lg-pass');
      if (pw) { pw.type = UI.showPass ? 'text' : 'password'; pw.focus(); }
      el.setAttribute('aria-pressed', String(UI.showPass));
      el.setAttribute('aria-label', UI.showPass ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
      el.title = el.getAttribute('aria-label');
      el.innerHTML = eyeIcon(UI.showPass);
      break;
    }
    case 'logout': doLogout(); break;
    case 'picReach': setState(function () { S.screen = 'cands'; S.cf = cfDefault(); S.cf.from = ''; S.cf.to = ''; S.cf.pic = v; S.cf.reach = k || ''; S.sel = null; S.cpage = 1; }); window.scrollTo(0, 0); break;
    case 'picCands': setState(function () { S.screen = 'cands'; S.cf = cfDefault(); S.cf.from = ''; S.cf.to = ''; S.cf.pic = v; S.sel = null; S.cpage = 1; }); window.scrollTo(0, 0); break;
    case 'reasonTab': setState(function () { S.reasonTab = v; }); break;
    // Nút Cập nhật: lấy số thẳng từ Google Sheets, không còn hộp thoại tải file Excel
    case 'openUpdate':
      if (CFG.dataUrl && UI.cred) refreshOnline(false);
      else { UI.error = NOT_LINKED; render(); window.scrollTo(0, 0); }
      break;
    case 'closeUpdate': UI.upd = false; UI.updErr = ''; render(); break;
    case 'doImport': doImport(); break;
    case 'excel': exportExcel(); break;
    case 'tab': setState(function () { S.tab = v; }); window.scrollTo(0, 0); break;
    case 'closeDetail': setState(function () { if (S.tab === 'detail') S.tab = 'overview'; S.detail = null; }); break;
    case 'view': setState(function () {
      if (v === 'custom' && S.view !== 'custom') { var p = curP(); S.from = p.s; S.to = p.e; }
      if (v !== 'custom') S.pk = '';
      S.view = v; invalidate();
    }); break;
    case 'trend': setState(function () { if (v === 'month') { if (S.view !== 'month') { S.view = 'month'; S.pk = ''; } } else if (S.view === 'month') { S.view = 'week'; S.pk = ''; } }); break;
    case 'pop': UI.pop = UI.pop === k ? null : k; UI.popQ = ''; render(); var inp = document.querySelector('.pop input[type=search]'); if (inp) inp.focus(); break;
    case 'popClose': UI.pop = null; UI.popQ = ''; render(); break;
    case 'msClear': setState(function () { S.f[k] = []; invalidate(); }); break;
    case 'clearAll': setState(function () {
      var keep = D.access && D.access.role === 'MANAGER' ? S.f.dept : [];
      S.f = defaultState().f; S.f.dept = keep; S.view = 'week'; S.pk = ''; S.cmp = 'prev'; invalidate();
    }); break;
    case 'drill': setState(function () { openDetail({ status: el.getAttribute('data-st'), pic: el.getAttribute('data-pic') || '', dept: el.getAttribute('data-dept') || '' }); }); break;
    case 'drillC': setState(function () { openDetail({ kind: 'cand', stage: el.getAttribute('data-stage'), q: '' }); }); break;
    case 'dStatus': setState(function () { S.detail.status = v; S.detail.prov = ''; S.detail.page = 1; }); break;
    case 'dPic': setState(function () { S.detail.pic = S.detail.pic === v ? '' : v; S.detail.page = 1; }); break;
    case 'dPicSel0': setState(function () { S.detail.pic = ''; S.detail.prov = ''; S.detail.page = 1; }); break;
    case 'dDept': setState(function () { S.detail.dept = ''; S.detail.page = 1; }); break;
    case 'dSort': setState(function () {
      var d = S.detail; if (d.sort === v) d.dir = d.dir === 'asc' ? 'desc' : 'asc'; else { d.sort = v; d.dir = 'asc'; } d.page = 1;
    }); break;
    case 'dPage': setState(function () { S.detail.page = +v; }); break;
    case 'dStage': setState(function () { S.detail.stage = v; S.detail.page = 1; }); break;
    case 'dCPage': setState(function () { S.detail.page = +v; }); break;
    case 'toggleInactive': setState(function () { S.showInactive = !S.showInactive; }); break;
    case 'rqCands': setState(function () {
      // Danh sách ứng viên của 1 RQ: bỏ giới hạn ngày để thấy đủ ứng viên của RQ
      S.screen = 'cands'; S.cf = cfDefault(); S.cf.from = ''; S.cf.to = ''; S.cf.job = v; S.sel = null; S.cpage = 1;
    }); window.scrollTo(0, 0); break;
    case 'openCands': setState(function () { S.screen = 'cands'; S.cf = cfDefault(); if (S.detail && S.detail.q) S.cf.q = S.detail.q; S.sel = null; S.cpage = 1; }); window.scrollTo(0, 0); break;
    case 'selCand': setState(function () {
      if (S.screen !== 'cands') { S.screen = 'cands'; S.cf = cfDefault(); S.cpage = 1; window.scrollTo(0, 0); }
      S.sel = v ? +v : null;
    }); break;
    case 'back': setState(function () { S.screen = 'main'; S.sel = null; }); window.scrollTo(0, 0); break;
    case 'cPage': setState(function () { S.cpage = +v; }); break;
    case 'cfDel': setState(function () { if (k === 'date') { S.cf.from = ''; S.cf.to = ''; } else S.cf[k] = ''; S.cpage = 1; }); break;
    case 'cfClear': setState(function () { S.cf = { from: '', to: '', job: '', reach: '', pic: '', major: '', src: '', round: '', res: '', q: '' }; S.cpage = 1; }); break;
  }
});

document.addEventListener('change', function (e) {
  var el = e.target, c = el.getAttribute && el.getAttribute('data-chg'); if (!c) return;
  var k = el.getAttribute('data-k');
  if (c === 'updFile') { UI.updFile = el.files && el.files[0] ? el.files[0] : null; UI.updErr = ''; render(); return; }
  if (c === 'ms') {
    var arr = S.f[k], v = el.value, i = arr.indexOf(v);
    if (el.checked && i < 0) arr.push(v); else if (!el.checked && i >= 0) arr.splice(i, 1);
    if (k === 'dept') { var ok = dimOptions('major').map(function (o) { return o[0]; }); S.f.major = S.f.major.filter(function (m) { return ok.indexOf(m) >= 0; }); }
    invalidate(); render();
    var inp = document.querySelector('.pop input[type=search]'); if (inp) inp.focus();
    return;
  }
  setState(function () {
    if (c === 'pk') S.pk = el.value;
    else if (c === 'year') { if (+el.value > 1999) setYear(+el.value); }
    else if (c === 'cmp') S.cmp = el.value;
    else if (c === 'from') S.from = el.value;
    else if (c === 'to') S.to = el.value;
    else if (c === 'hideNo') S.hideNo = el.checked;
    else if (c === 'dProv') { S.detail.prov = el.value; S.detail.page = 1; }
    else if (c === 'dPicSel') { S.detail.pic = el.value; S.detail.prov = ''; S.detail.page = 1; }
    else if (c === 'cf') { S.cf[k] = el.value; S.cpage = 1; }
    invalidate();
  });
});

var inpTimer = null;
document.addEventListener('input', function (e) {
  var el = e.target, c = el.getAttribute && el.getAttribute('data-inp'); if (!c) return;
  if (c === 'popq') {
    UI.popQ = el.value;
    var pop = el.closest('.pop'), k = UI.pop;
    var tmp = document.createElement('div'); tmp.innerHTML = popHtml(k);
    pop.querySelector('.opts').innerHTML = tmp.querySelector('.opts').innerHTML;
    return;
  }
  clearTimeout(inpTimer);
  inpTimer = setTimeout(function () {
    var id = el.id, pos = el.selectionStart;
    if (c === 'dq') { S.detail.q = el.value; S.detail.page = 1; }
    if (c === 'cfq') { S.cf.q = el.value; S.cpage = 1; }
    render();
    var n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} }
  }, 250);
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && UI.pop) { UI.pop = null; render(); }
  // Thẻ dạng div role=button: Enter / Space để bấm
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button') { e.preventDefault(); e.target.click(); }
});

/* Tooltip */
var tip = document.getElementById('tip');
document.addEventListener('mouseover', function (e) {
  var el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.style.opacity = 0; return; }
  tip.textContent = el.getAttribute('data-tip'); tip.style.opacity = 1;
});
document.addEventListener('mousemove', function (e) {
  if (tip.style.opacity !== '1') return;
  var x = e.clientX + 14, y = e.clientY + 14;
  if (x + tip.offsetWidth > window.innerWidth - 8) x = e.clientX - tip.offsetWidth - 10;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});


window.__TA_DEBUG__ = { get D() { return D; }, get S() { return S; }, render: render };
load(false);
})();
